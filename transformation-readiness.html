main{max-width:1040px;margin:auto;padding:40px 24px 72px}

.dim{background:#fff;border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:12px;padding:24px 28px;margin-bottom:20px}

.sel{display:block;margin-top:8px;min-height:1.4em;font-size:.88rem;color:var(--muted)}
.who{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px 28px;margin:28px 0 16px}

.consent{display:flex;gap:10px;align-items:flex-start;margin:0 0 20px;color:var(--muted)}

.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:14px 30px;font:inherit;font-weight:700;cursor:pointer}

.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
#status{margin:18px 0 0;font-weight:700}

@media(max-width:700px){.grid2{grid-template-columns:1fr}.dim,.who,.legend{padding:20px}}

.badge{border-radius:12px;padding:26px 28px;border:2px solid}

.badge strong{display:block;font-size:2.6rem;line-height:1.1;margin:2px 0 8px}
.badge b{display:block;font-size:1.25rem}
.badge.r{background:#FBEAEA;border-color:#A12A2A;color:#7A1B1B}
.badge.a{background:#FFF3D6;border-color:#C98A00;color:#6B4600}
.badge.g{background:#E6F4EA;border-color:#1B6B3A;color:#14502B}
.tw{overflow-x:auto}
.tw table{border-collapse:collapse;width:100%;min-width:760px}
.tw th,.tw td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);font-size:.92rem}
.tw th{background:var(--bg);color:var(--navy)}
.sc{font-weight:800;white-space:nowrap}

.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--navy);margin-top:22px}

.home{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--navy);text-decoration:none;font-weight:700;padding:8px 16px;border-radius:8px;margin-right:auto}

[["Critical risk: will delay migration or corrupt the new ERP landscape.","Risque critique : retard de la migration ou corruption du nouveau paysage ERP."],["Data issues are known but not remediated; plan cleansing capacity early.","Problèmes de données connus mais non traités ; planifiez tôt la capacité de nettoyage."],["Solid data foundation; keep ownership and standards active during the project.","Base de données solide ; maintenez propriétaires et standards actifs pendant le projet."]],
[["Burnout risk: project milestones will likely slip.","Risque d’épuisement : les jalons du projet vont probablement glisser."],["Capacity is stretched; backfill key SMEs and plan for change fatigue.","Capacité sous tension ; remplacez les experts clés et anticipez la fatigue du changement."],["Capacity and skills are in place; protect SME availability.","Capacité et compétences en place ; protégez la disponibilité des experts."]],
[["No clear migration or rollback approach: technical risk during the cutover window.","Pas d’approche de migration ni de retour arrière claire : risque technique pendant la bascule."],["Approach partly defined; confirm rollback and continuity before planning cutover.","Approche en partie définie ; confirmez retour arrière et continuité avant de planifier la bascule."],["Migration approach and fallback are defined; keep rehearsing cutover.","Approche de migration et plan de repli définis ; poursuivez les répétitions de bascule."]],
[["AI ambitions are premature; fix data and use cases first.","Les ambitions IA sont prématurées ; traitez d’abord les données et les cas d’usage."],["Groundwork under way; sharpen use cases and guardrails.","Les bases se mettent en place ; précisez les cas d’usage et les garde-fous."],["Ready to scale AI use cases on a sound foundation.","Prêt à déployer des cas d’usage d’IA sur une base solide."]],
[["Budget, timeline, partner or ERP choices are still open: launch is premature.","Budget, calendrier, partenaire ou choix ERP encore ouverts : le lancement est prématuré."],["Foundation partly in place; lock budget, partner and architecture decisions before launch.","Fondations partiellement en place ; verrouillez budget, partenaire et architecture avant le lancement."],["Budget, ERP solution and partners are locked in.","Budget, solution ERP et partenaires sont verrouillés."]]
];
const OV5=["Leadership wants the change but key SMEs are double-hatting: burnout risk, milestones will likely slip.","La direction veut le changement mais les experts clés cumulent deux rôles : risque d’épuisement, jalons susceptibles de glisser."];
const OV7=["Technology ready, data isn’t: AI initiatives will fail until Data Quality is fixed.","Technologie prête, données non : les initiatives IA échoueront tant que la qualité des données n’est pas corrigée."];
let LAST=null;
const band=v=>v<2.5?"r":(v>3.8?"g":"a");
function compute(){
  const sc=D.map((d,di)=>d.q.map((q,qi)=>A["q"+(di+1)+"_"+(qi+1)]));
  const avg=sc.map(a=>a.reduce((x,y)=>x+y,0)/a.length);
  return {sc,avg,overall:avg.reduce((x,y)=>x+y,0)/avg.length};
}
function challenge(di,R,lg){
  lg=lg||L;
  const v=R.avg[di];let t=CH[di][band(v)==="r"?0:band(v)==="a"?1:2];
  if(di===4&&R.avg[0]>3.8&&v<3)t=OV5;
  if(di===6&&v>=3&&R.avg[3]<2.5)t=OV7;
  return t[lg==="fr"?1:0];
}
function gapText(di,R,lg){
  lg=lg||L;
  const v=R.avg[di],tg=TG[di],o=lg==="fr"?2:0;
  if(v>=tg)return T[lg].none;
  const k=R.sc[di].indexOf(Math.min.apply(null,R.sc[di]));
  return D[di].q[k][o]+" (−"+(tg-v).toFixed(1)+")";
}
function radar(R){
  const cx=230,cy=215,Rr=125,n=D.length,pt=(v,k)=>{const a=-Math.PI/2+2*Math.PI*k/n,r=Rr*v/5;return [cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  const poly=vals=>vals.map((v,k)=>pt(v,k).map(x=>x.toFixed(1)).join(",")).join(" ");
  let g="";
  for(let r=1;r<=5;r++)g+=`<polygon points="${poly(Array(n).fill(r))}" fill="none" stroke="#C5CEDD" stroke-width="1"/>`;
  for(let k=0;k<n;k++){const e=pt(5,k),l=pt(5.9,k),c=Math.cos(-Math.PI/2+2*Math.PI*k/n);
    g+=`<line x1="${cx}" y1="${cy}" x2="${e[0].toFixed(1)}" y2="${e[1].toFixed(1)}" stroke="#C5CEDD"/>`+
       `<text x="${l[0].toFixed(1)}" y="${(l[1]+4).toFixed(1)}" font-size="12" font-weight="700" fill="#14213D" text-anchor="${c>.3?"start":c<-.3?"end":"middle"}">${SH[k][L==="fr"?1:0]}</text>`;}
  g+=`<polygon points="${poly(TG)}" fill="none" stroke="#2FA8CC" stroke-width="2" stroke-dasharray="5 4"/>`;
  g+=`<polygon points="${poly(R.avg)}" fill="rgba(27,66,135,.25)" stroke="#1B4287" stroke-width="2.5"/>`;
  R.avg.forEach((v,k)=>{const q=pt(v,k);g+=`<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="4" fill="#1B4287"/>`});
  return `<svg viewBox="0 0 460 430" role="img" aria-label="${T[L].res_r}" style="width:100%;max-width:460px">${g}</svg>`+
    `<p class="rl"><i class="k1"></i>${T[L].res_cur} <i class="k2"></i>${T[L].res_tg}</p>`;
}
function showResults(R,scroll){
  LAST=R;const t=T[L],b=band(R.overall),bt=b==="r"?t.bs:b==="a"?t.bm:t.bg,i=L==="fr"?1:0;
  const rows=D.map((d,di)=>{const v=R.avg[di];
    return `<tr><td><b>${di+1}. ${d.n[i]}</b></td><td><span class="sc ${band(v)}"><i></i>${v.toFixed(1)}</span></td><td>${TG[di].toFixed(1)}</td><td>${gapText(di,R)}</td><td>${challenge(di,R)}</td></tr>`}).join("");
  const el=document.getElementById("res");
  el.innerHTML=`<h2>${t.res_h}</h2><div class="rtop"><div>${radar(R)}</div>`+
    `<div class="badge ${b}"><div><small>${t.res_o}</small><strong>${R.overall.toFixed(1)} / 5</strong><b>${bt[0]}</b><span>${bt[1]}</span></div></div></div>`+
    `<h3>${t.res_t}</h3><div class="tw"><table><thead><tr><th>${t.th1}</th><th>${t.th2}</th><th>${t.th3}</th><th>${t.th4}</th><th>${t.th5}</th></tr></thead><tbody>${rows}</tbody></table></div>`+
    `<button type="button" class="btn alt" id="again">${t.again}</button>`;
  el.hidden=false;
  document.getElementById("again").onclick=()=>{A={};LAST=null;el.hidden=true;f.reset();render();say("");refreshSend(false);window.scrollTo({top:0,behavior:"smooth"})};
  if(scroll)el.scrollIntoView({behavior:"smooth",block:"start"});
}
let L="en",A={};

function render(){
  const i=L==="fr"?1:0, o=L==="fr"?2:0;
  document.getElementById("scale").innerHTML=SC[L].map((s,k)=>`<li><b>${k+1}. ${s[0]}</b>${s[1]}</li>`).join("");
  document.getElementById("dims").innerHTML=D.map((d,di)=>`<div class="dim"><h3>${d.n[i]}</h3><p class="foc">${d.f[i]}</p>`+
    d.q.map((q,qi)=>{const id=`q${di+1}_${qi+1}`;
      return `<div class="q"><p><b>${di+1}.${qi+1} ${q[o]}</b><br>${q[o+1]}</p><div class="opts" role="radiogroup" aria-label="${q[o]}">`+
      [1,2,3,4,5].map(n=>`<label class="pill"><input type="radio" name="${id}" value="${n}"${A[id]===n?" checked":""} title="${SC[L][n-1][0]}"><span>${n}</span></label>`).join("")+
      `</div><span class="sel" id="s_${id}">${A[id]?A[id]+" – "+SC[L][A[id]-1][0]:""}</span></div>`}).join("")+`</div>`).join("");
  progress();
}
function progress(){
  const n=Object.keys(A).length;
  document.getElementById("pt").textContent=n+" / "+TOTAL+" "+T[L].prog;
  document.getElementById("bar").style.width=(n/TOTAL*100)+"%";
}
function setLang(l){
  L=l;document.documentElement.lang=l;
  document.querySelectorAll("[data-i]").forEach(e=>{e.textContent=T[l][e.dataset.i]});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  render();
  if(LAST)showResults(LAST,false);
  try{refreshSend(false)}catch(e){}   // not ready yet on the very first call
  try{localStorage.setItem("lang",l)}catch(e){}
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
document.getElementById("dims").addEventListener("change",e=>{
  if(e.target.type!=="radio")return;
  const v=+e.target.value;A[e.target.name]=v;
  document.getElementById("s_"+e.target.name).textContent=v+" – "+SC[L][v-1][0];
  progress();
});
let start="en";try{start=localStorage.getItem("lang")||"en"}catch(e){}
setLang(T[start]?start:"en");

const COOLDOWN=10*60*1000,SENT_KEY="sent_assess";   // after a successful send, block further emails from this browser for 10 minutes
function cooldownLeft(){try{return Math.max(0,(+localStorage.getItem(SENT_KEY)||0)+COOLDOWN-Date.now())}catch(e){return 0}}
function markSent(){try{localStorage.setItem(SENT_KEY,String(Date.now()))}catch(e){}}
let busyFlag=false,lockTimer=0;
function refreshSend(keep){   // grey out the send button while an email from this browser is still locked
  const b=document.getElementById("send"),s=document.getElementById("status"),left=cooldownLeft();
  clearTimeout(lockTimer);
  if(left>0){
    b.disabled=true;b.textContent=T[L].sentbtn;
    if(!keep||s.className==="lock"){s.textContent=T[L].lock.replace("{m}",Math.ceil(left/60000));s.className="lock"}
    lockTimer=setTimeout(()=>refreshSend(true),Math.min(left,60000)+250);
  }else if(!busyFlag){
    b.disabled=false;b.textContent=T[L].send;
    if(s.className==="lock"){s.textContent="";s.className=""}
  }
}
const f=document.getElementById("f"),st=document.getElementById("status"),btn=document.getElementById("send");
refreshSend(false);
function say(m,c){st.textContent=m;st.className=c||""}
f.addEventListener("submit",async e=>{
  e.preventDefault();
  const missing=TOTAL-Object.keys(A).length;
  if(missing>0){say(T[L].miss+missing+T[L].miss2,"err");
    for(let d=1;d<=D.length;d++)for(let q=1;q<=D[d-1].q.length;q++){if(!A["q"+d+"_"+q]){document.querySelector('[name="q'+d+'_'+q+'"]').closest(".q").scrollIntoView({behavior:"smooth",block:"center"});return}}}
  const nm=document.getElementById("nm").value.trim(),em=document.getElementById("em").value.trim(),co=document.getElementById("co").value.trim();
  if(!nm||!/^\S+@\S+\.\S+$/.test(em)||!document.getElementById("ok").checked){say(T[L].info,"err");return}
  const R=compute();showResults(R,true);
  if(cooldownLeft()>0){say(T[L].again,"ok");return}      // results stay visible, but no further email
  const lines=[];
  D.forEach((d,di)=>{
    lines.push((di+1)+". "+d.n[0]+": "+R.avg[di].toFixed(1)+"/5 (target "+TG[di].toFixed(1)+")");
    d.q.forEach((q,qi)=>lines.push("   Q"+(di+1)+"."+(qi+1)+" "+q[0]+": "+R.sc[di][qi]));
  });
  const b=band(R.overall),status=b==="r"?T.en.bs[0]:b==="a"?T.en.bm[0]:T.en.bg[0];
  const matrix=D.map((d,di)=>(di+1)+". "+d.n[0]+" | Avg "+R.avg[di].toFixed(1)+" | Target "+TG[di].toFixed(1)+" | Gap / blind spot: "+gapText(di,R,"en")+" | Challenge & impact: "+challenge(di,R,"en"));
  const msg="Overall average: "+R.overall.toFixed(1)+"/5 ("+status+")\nLanguage: "+L+"\nName: "+nm+"\nEmail: "+em+"\nCompany: "+(co||"-")+
    "\n\nDIMENSION SUMMARY AND GAP MATRIX\n"+matrix.join("\n\n")+"\n\nDETAILED ANSWERS\n"+lines.join("\n");
  busyFlag=true;btn.disabled=true;btn.textContent=T[L].sending;say("");
  try{
    const r=await fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},
      body:JSON.stringify({access_key:ACCESS_KEY,subject:"Readiness assessment: "+(co||nm),from_name:"Assessment form",name:nm,email:em,message:msg,botcheck:document.getElementById("bot").checked})});
    const j=await r.json();
    say(j.success?T[L].ok:T[L].err,j.success?"ok":"err");
    if(j.success){markSent()}
  }catch(x){say(T[L].err,"err")}
  busyFlag=false;refreshSend(true);
});
</script>
</body>
