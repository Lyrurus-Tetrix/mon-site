<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Arnaud Gavanier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0A1F44;--navy2:#13306B;--ridge:#1B4287;--ink:#14213D;--muted:#3B4760;--bg:#F4F6FA;--line:#C5CEDD;--sky:#8EB8FF}
*{box-sizing:border-box}
body{margin:0;font-family:Manrope,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
a{color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
header{background:var(--navy);color:#fff}
.bar{max-width:1040px;margin:auto;padding:14px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.brand{font-weight:800;text-decoration:none;margin-right:auto}
.lang button{background:none;border:1px solid #fff5;color:#fff;padding:4px 10px;border-radius:6px;cursor:pointer;font:inherit;font-size:.85rem;margin-left:6px}
.lang button[aria-pressed="true"]{background:#fff;color:var(--navy)}
main{max-width:640px;margin:auto;padding:56px 24px 72px}
h1{font-size:clamp(1.8rem,4vw,2.5rem);color:var(--navy);margin:0 0 12px;letter-spacing:-.02em}
.intro{color:var(--muted);margin:0 0 32px}
label{display:block;font-weight:700;margin:0 0 6px;color:var(--navy)}
input,textarea{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);margin-bottom:20px}
textarea{min-height:170px;resize:vertical}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:13px 28px;font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{background:#8A94A8;color:#fff;opacity:1;cursor:not-allowed}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
#status{margin:20px 0 0;font-weight:700}
#status.ok{color:#1B6B3A}
#status.err{color:#A12A2A}
.note{font-size:.85rem;color:var(--muted);margin-top:28px}
.back{display:inline-block;margin-top:8px}

body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%201440%20900%27%20preserveAspectRatio%3D%27xMidYMid%20slice%27%3E%3Cdefs%3E%3Cpattern%20id%3D%27d%27%20width%3D%2714%27%20height%3D%2714%27%20patternUnits%3D%27userSpaceOnUse%27%3E%3Ccircle%20cx%3D%277%27%20cy%3D%277%27%20r%3D%271.3%27%20fill%3D%27%231B4287%27%2F%3E%3C%2Fpattern%3E%3C%2Fdefs%3E%3Cg%20fill%3D%27%232FA8CC%27%20opacity%3D%27.07%27%3E%3Ccircle%20cx%3D%2770%27%20cy%3D%27250%27%20r%3D%2734%27%2F%3E%3Ccircle%20cx%3D%27150%27%20cy%3D%27330%27%20r%3D%2718%27%2F%3E%3Ccircle%20cx%3D%2740%27%20cy%3D%27420%27%20r%3D%2726%27%2F%3E%3Ccircle%20cx%3D%27230%27%20cy%3D%27190%27%20r%3D%2714%27%2F%3E%3Ccircle%20cx%3D%27120%27%20cy%3D%27120%27%20r%3D%2722%27%2F%3E%3Ccircle%20cx%3D%271380%27%20cy%3D%27520%27%20r%3D%2728%27%2F%3E%3Ccircle%20cx%3D%271290%27%20cy%3D%27610%27%20r%3D%2716%27%2F%3E%3C%2Fg%3E%3Cg%20transform%3D%27translate%28930%2060%29%20skewY%28-5%29%27%20fill%3D%27none%27%20stroke%3D%27%231B4287%27%20stroke-width%3D%271.4%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%20opacity%3D%27.11%27%3E%3Crect%20width%3D%27420%27%20height%3D%27260%27%20rx%3D%2712%27%20fill%3D%27%232FA8CC%27%20fill-opacity%3D%27.05%27%2F%3E%3Crect%20x%3D%2724%27%20y%3D%2730%27%20width%3D%27150%27%20height%3D%2796%27%20fill%3D%27url%28%23d%29%27%20stroke%3D%27none%27%2F%3E%3Cpath%20d%3D%27M200%2090L214%2070L226%20100L240%2060L252%2096L266%2074L280%20104L294%2066L308%2098L322%2082%27%2F%3E%3Ccircle%20cx%3D%27356%27%20cy%3D%2762%27%20r%3D%277%27%2F%3E%3Cpath%20d%3D%27M356%2069V82%27%2F%3E%3Ccircle%20cx%3D%27120%27%20cy%3D%27176%27%20r%3D%277%27%2F%3E%3Cpath%20d%3D%27M120%20183V196%27%2F%3E%3Ccircle%20cx%3D%27300%27%20cy%3D%27186%27%20r%3D%2734%27%2F%3E%3Ccircle%20cx%3D%27300%27%20cy%3D%27186%27%20r%3D%2722%27%20stroke-dasharray%3D%274%205%27%2F%3E%3Cpath%20d%3D%27M30%20226H110M30%20206H70%27%2F%3E%3C%2Fg%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%232FA8CC%27%20stroke-width%3D%271.8%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%20opacity%3D%27.14%27%3E%3Cpath%20d%3D%27M-40%20870C300%20850%20620%20720%20900%20540S1250%20210%201400%20100%27%20stroke-dasharray%3D%276%209%27%2F%3E%3Cpath%20d%3D%27M-40%20900C300%20880%20650%20760%20940%20590S1290%20270%201410%20150%27%20opacity%3D%27.6%27%2F%3E%3Cpath%20d%3D%27M1366%20112L1412%2090L1404%20140%27%2F%3E%3C%2Fg%3E%3Cg%20transform%3D%27translate%2840%20520%29%20skewY%284%29%27%20fill%3D%27none%27%20stroke%3D%27%231B4287%27%20stroke-width%3D%271.4%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%20opacity%3D%27.10%27%3E%3Crect%20width%3D%27330%27%20height%3D%27210%27%20rx%3D%2712%27%20fill%3D%27%232FA8CC%27%20fill-opacity%3D%27.05%27%2F%3E%3Cpath%20d%3D%27M36%20180V120M72%20180V90M108%20180V140M144%20180V70M180%20180V110M216%20180V60M252%20180V100M288%20180V76%27%2F%3E%3Cpath%20d%3D%27M36%20110L108%2078L180%2098L252%2050L296%2064%27%20stroke-dasharray%3D%275%206%27%2F%3E%3Crect%20x%3D%2736%27%20y%3D%2724%27%20width%3D%27120%27%20height%3D%2734%27%20fill%3D%27url%28%23d%29%27%20stroke%3D%27none%27%2F%3E%3C%2Fg%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%231B4287%27%20stroke-width%3D%271.3%27%20opacity%3D%27.08%27%3E%3Ccircle%20cx%3D%27250%27%20cy%3D%27470%27%20r%3D%27120%27%20stroke-dasharray%3D%273%209%27%2F%3E%3Ccircle%20cx%3D%27250%27%20cy%3D%27470%27%20r%3D%2786%27%20stroke-dasharray%3D%2710%207%27%2F%3E%3Ccircle%20cx%3D%271180%27%20cy%3D%27700%27%20r%3D%27110%27%20stroke-dasharray%3D%273%209%27%2F%3E%3Ccircle%20cx%3D%271180%27%20cy%3D%27700%27%20r%3D%2770%27%20stroke-dasharray%3D%2712%208%27%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") center/cover no-repeat}
.home{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--navy);text-decoration:none;font-weight:700;padding:8px 16px;border-radius:8px;margin-right:auto}
.home:hover{background:var(--sky)}

/* buttons: slight lift, soft shadow and a small colour change on hover */
.btn,.home{transition:transform .2s cubic-bezier(.2,.7,.2,1),box-shadow .2s ease,background-color .2s ease,border-color .2s ease,color .2s ease}
@media (hover:hover){
  .btn:not(:disabled):hover{background:var(--ridge)}
  .btn.alt:not(:disabled):hover{background:#EAF0FA;border-color:var(--ridge)}
}
@media (hover:hover) and (prefers-reduced-motion:no-preference){
  .btn:not(:disabled):hover,.home:hover{transform:translateY(-2px);box-shadow:0 10px 18px -10px rgba(10,31,68,.55)}
  .btn:not(:disabled):active,.home:active{transform:translateY(0);box-shadow:none}
}
</style>
<script src="config.js"></script>
<script src="features.js"></script>
</head>
<body>
<header><div class="bar">
<a class="home" href="index.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span data-i="home"></span></a>
<div class="lang" role="group" aria-label="Language"><button data-l="en">EN</button><button data-l="fr">FR</button><button data-l="de">DE</button></div>
</div></header>

<main>
<h1 data-i="t"></h1>
<p class="intro" data-i="intro"></p>
<form id="f" novalidate>
<label for="name" data-i="l_name"></label>
<input id="name" name="name" type="text" autocomplete="name" required>
<label for="email" data-i="l_email"></label>
<input id="email" name="email" type="email" autocomplete="email" required>
<label for="message" data-i="l_msg"></label>
<textarea id="message" name="message" required></textarea>
<input class="hp" type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true">
<button class="btn" type="submit" id="send" data-i="send"></button>
<p id="status" role="status" aria-live="polite"></p>
</form>
<p class="note" data-i="note"></p>
<a class="back" href="index.html" data-i="back"></a>
</main>

<script>
/* Paste your Web3Forms access key between the quotes (see instructions) */
const ACCESS_KEY="e55a5d88-0544-40b7-a704-7d0ed1174a7f";

const T={
en:{t:"Get in touch",intro:"Planning a transformation or preparing an RFP? Tell me a bit about it and I will get back to you.",
l_name:"Your name",l_email:"Your email",l_msg:"Your message",send:"Send message",sending:"Sending...",
ok:"Thank you, your message has been sent.",err:"Something went wrong. Please try again, or reach out on LinkedIn.",
miss:"Please fill in your name, a valid email and a message.",key:"The form is not configured yet.",wait:"Please wait a moment before sending.",again:"A message was already sent from this browser. Please try again in a few minutes.",
note:"Your message is delivered by email through the Web3Forms service and used only to reply to you.",sentbtn:"Already sent",lock:"A message was already sent from this browser. You can send another in about {m} min.",home:"Home",back:"Back to the site"},
fr:{t:"Me contacter",intro:"Un projet de transformation ou un appel d'offres en préparation ? Décrivez-le-moi en quelques lignes et je reviens vers vous.",
l_name:"Votre nom",l_email:"Votre e-mail",l_msg:"Votre message",send:"Envoyer",sending:"Envoi en cours...",
ok:"Merci, votre message a bien été envoyé.",err:"Une erreur est survenue. Réessayez, ou contactez-moi sur LinkedIn.",
miss:"Merci de renseigner votre nom, un e-mail valide et un message.",key:"Le formulaire n'est pas encore configuré.",wait:"Merci de patienter un instant avant d’envoyer.",again:"Un message a déjà été envoyé depuis ce navigateur. Réessayez dans quelques minutes.",
note:"Votre message est transmis par e-mail via le service Web3Forms et utilisé uniquement pour vous répondre.",sentbtn:"Déjà envoyé",lock:"Un message a déjà été envoyé depuis ce navigateur. Vous pourrez en envoyer un autre dans environ {m} min.",home:"Accueil",back:"Retour au site"},
de:{t:"Kontakt aufnehmen",intro:"Eine Transformation geplant oder eine Ausschreibung in Vorbereitung? Schildern Sie mir kurz Ihr Anliegen, ich melde mich bei Ihnen.",
l_name:"Ihr Name",l_email:"Ihre E-Mail",l_msg:"Ihre Nachricht",send:"Nachricht senden",sending:"Wird gesendet...",
ok:"Vielen Dank, Ihre Nachricht wurde gesendet.",err:"Etwas ist schiefgelaufen. Bitte versuchen Sie es erneut oder schreiben Sie mir auf LinkedIn.",
miss:"Bitte geben Sie Ihren Namen, eine gültige E-Mail und eine Nachricht ein.",key:"Das Formular ist noch nicht konfiguriert.",wait:"Bitte warten Sie einen Moment vor dem Senden.",again:"Von diesem Browser wurde bereits eine Nachricht gesendet. Bitte versuchen Sie es in einigen Minuten erneut.",
note:"Ihre Nachricht wird per E-Mail über den Dienst Web3Forms zugestellt und nur zur Beantwortung verwendet.",sentbtn:"Bereits gesendet",lock:"Von diesem Browser wurde bereits eine Nachricht gesendet. Sie können in etwa {m} Min. eine weitere senden.",home:"Startseite",back:"Zurück zur Website"}
};
let L="en";
function setLang(l){
  L=l;document.documentElement.lang=l;
  document.querySelectorAll("[data-i]").forEach(e=>{e.textContent=T[l][e.dataset.i]});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  try{refreshSend(false)}catch(e){}   // not ready yet on the very first call
  try{localStorage.setItem("lang",l)}catch(e){}
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
let start="en";try{start=localStorage.getItem("lang")||"en"}catch(e){}
setLang(T[start]?start:"en");

const COOLDOWN=10*60*1000,SENT_KEY="sent_contact";   // after a successful send, block further emails from this browser for 10 minutes
function cooldownLeft(){try{return Math.max(0,(+localStorage.getItem(SENT_KEY)||0)+COOLDOWN-Date.now())}catch(e){return 0}}
function markSent(){try{localStorage.setItem(SENT_KEY,String(Date.now()))}catch(e){}}
let busyFlag=false,lockTimer=0;
function refreshSend(keep){   // grey out the send button while an email from this browser is still locked
  const b=document.getElementById("send"),s=document.getElementById("status"),left=cooldownLeft();
  clearTimeout(lockTimer);
  if(left>0){
    b.disabled=true;b.textContent=T[L].sentbtn;
    if(!keep||s.className==="lock"){s.textContent=T[L].lock.replace("{m}",Math.ceil(left/60000));s.className="lock"}
    lockTimer=setTimeout(()=>refreshSend(true),Math.min(left,60000)+250);
  }else if(!busyFlag){
    b.disabled=false;b.textContent=T[L].send;
    if(s.className==="lock"){s.textContent="";s.className=""}
  }
}
const T0=Date.now();
const f=document.getElementById("f"),st=document.getElementById("status"),btn=document.getElementById("send");
refreshSend(false);
function say(msg,cls){st.textContent=msg;st.className=cls||""}
f.addEventListener("submit",async e=>{
  e.preventDefault();
  const d=Object.fromEntries(new FormData(f));
  if(!d.name.trim()||!/^\S+@\S+\.\S+$/.test(d.email)||!d.message.trim()){say(T[L].miss,"err");return}
  if(ACCESS_KEY==="YOUR_ACCESS_KEY"){say(T[L].key,"err");return}
  if(cooldownLeft()>0){say(T[L].again,"err");return}
  if(Date.now()-T0<3000){say(T[L].wait,"err");return}      // form filled faster than a human can
  busyFlag=true;btn.disabled=true;btn.textContent=T[L].sending;say("");
  try{
    const r=await fetch("https://api.web3forms.com/submit",{method:"POST",
      headers:{"Content-Type":"application/json",Accept:"application/json"},
      body:JSON.stringify({access_key:ACCESS_KEY,subject:"New message from your website",from_name:"Website contact form",
        name:d.name,email:d.email,message:d.message,botcheck:f.botcheck.checked})});
    const j=await r.json();
    if(j.success){say(T[L].ok,"ok");f.reset();markSent()}else{say(T[L].err,"err")}
  }catch(x){say(T[L].err,"err")}
  busyFlag=false;refreshSend(true);
});
</script>
</body>
</html>
