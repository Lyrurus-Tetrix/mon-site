<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SAP ERP RFP Readiness Checklist Generator | Arnaud Gavanier</title>
<link rel="preload" href="/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--navy:#0A1F44;--navy2:#13306B;--ridge:#1B4287;--ink:#14213D;--muted:#3B4760;--bg:#F4F6FA;--line:#C5CEDD;--sky:#8EB8FF}
*{box-sizing:border-box}
body{margin:0;font-family:SiteManrope,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
a{color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
header{background:var(--navy);color:#fff}
.bar{max-width:1040px;margin:auto;padding:14px 24px;display:flex;align-items:center;gap:24px}
.brand{font-weight:800;text-decoration:none;margin-right:auto}
.lang{display:flex;align-items:center;gap:7px;flex:none}.lang a{display:inline-flex;align-items:center;justify-content:center;min-width:42px;height:34px;padding:0 11px;border:1px solid #ffffff65;border-radius:999px;background:#ffffff0a;color:#fff;font:inherit;font-size:.76rem;font-weight:800;letter-spacing:.06em;text-decoration:none;transition:background .18s,border-color .18s,color .18s}.lang a:hover{border-color:#fff;background:#ffffff22;color:#fff}.lang a[aria-current="page"]{border-color:#fff;background:#fff;color:var(--navy)}
.top{background:linear-gradient(180deg,var(--navy),var(--navy2));color:#fff}
.top .in{max-width:1040px;margin:auto;padding:60px 24px 52px}
.top h1{font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.12;margin:0 0 16px;letter-spacing:-.02em;max-width:18em}
.top p{margin:0;max-width:42em;font-size:1.1rem;color:#EAF1FF}
main{max-width:1040px;margin:auto;padding:36px 24px 72px}
h2{font-size:1.5rem;margin:0 0 14px;color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px 28px;margin-bottom:22px}
fieldset{border:0;padding:0;margin:0 0 22px}
legend{font-weight:800;color:var(--navy);margin-bottom:10px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;cursor:pointer}
.opt span{display:block;padding:10px 16px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:600;color:var(--navy)}
.opt input:hover+span{border-color:var(--ridge)}
.opt input:checked+span{background:var(--navy);border-color:var(--navy);color:#fff}
.opt input:focus-visible+span{outline:3px solid var(--sky);outline-offset:2px}
.hint{font-weight:400;color:var(--muted);font-size:.9rem}
.btn{background:var(--navy);color:#fff;border:0;border-radius:8px;padding:14px 30px;font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{background:#8A94A8;cursor:not-allowed}
.btn.alt{background:#fff;color:var(--navy);border:1px solid var(--navy);margin-left:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;padding:0;list-style:none}
.chips li{background:var(--navy);color:#fff;border-radius:99px;padding:5px 14px;font-size:.88rem;font-weight:600}
.note{border-left:4px solid var(--ridge);background:#fff;border-radius:8px;padding:14px 18px;margin:0 0 14px;color:var(--ink)}
.sec{background:#fff;border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:12px;padding:22px 26px;margin-bottom:18px}
.sec.focus{border-top-color:#2FA8CC;box-shadow:0 0 0 2px #2FA8CC33}
.sec h3{margin:0 0 12px;font-size:1.2rem;color:var(--navy)}
.badge{font-size:.72rem;font-weight:800;background:#E3F4FA;color:#0B5E78;border-radius:99px;padding:3px 10px;margin-left:10px;vertical-align:middle}
.items{list-style:none;margin:0;padding:0}
.items li{padding:10px 0;border-top:1px solid var(--line)}
.items label{display:flex;gap:12px;cursor:pointer}
.items input{margin-top:6px;accent-color:var(--navy);width:18px;height:18px;flex:none}
.items b{color:var(--navy)}
.items small{display:block;color:var(--muted);margin-top:2px}
.prog{font-weight:700;color:var(--navy);margin:0 0 14px}
.tw{overflow-x:auto;margin-top:14px}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line);font-size:.92rem}
th{background:var(--bg);color:var(--navy)}
td input[type=date]{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px}
.fine{font-size:.85rem;color:var(--muted)}
@media print{header,.top,#params,.noprint{display:none!important}body{background:#fff}main{padding:0}.sec,.card{break-inside:avoid;box-shadow:none}}
.home{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--navy);text-decoration:none;font-weight:700;padding:8px 16px;border-radius:8px;margin-right:auto}
.home:hover{background:var(--sky)}

/* buttons: slight lift, soft shadow and a small colour change on hover */
.btn,.home{transition:transform .2s cubic-bezier(.2,.7,.2,1),box-shadow .2s ease,background-color .2s ease,border-color .2s ease,color .2s ease}
@media (hover:hover){
  .btn:not(:disabled):hover{background:var(--ridge)}
  .btn.alt:not(:disabled):hover{background:#EAF0FA;border-color:var(--ridge)}
}
@media (hover:hover) and (prefers-reduced-motion:no-preference){
  .btn:not(:disabled):hover,.home:hover{transform:translateY(-2px);box-shadow:0 10px 18px -10px rgba(10,31,68,.55)}
  .btn:not(:disabled):active,.home:active{transform:translateY(0);box-shadow:none}
}
:root{--deep-grad:linear-gradient(135deg,#050E24 0%,#0B2150 55%,#12306B 100%)}   /* darker navy, lightening slightly towards the bottom right */
header{background:var(--deep-grad)}
.top{background:var(--deep-grad)}
</style>

<section class="top"><div class="in"><h1 data-i="title">SAP ERP RFP Readiness Checklist Generator</h1>
<p data-i="intro">Select your parameters below to generate your tailored Request for Proposal (RFP) roadmap.</p></div></section>

<main>
<form id="params" class="card" novalidate>
<h2 data-i="step1">Step 1: Define your project parameters</h2>
<fieldset><legend data-i="project_type">Project type</legend><div class="opts">
<label class="opt"><input type="radio" name="type" value="pub"><span data-i="type_pub">S/4HANA Cloud Public Edition</span></label>
<label class="opt"><input type="radio" name="type" value="pri"><span data-i="type_pri">S/4HANA Cloud Private Edition</span></label>
<label class="opt"><input type="radio" name="type" value="onp"><span data-i="type_onp">On-Premises / Other</span></label></div></fieldset>
<fieldset><legend><span data-i="scope">Scope</span> <span class="hint" data-i="scope_hint">(select one or more)</span></legend><div class="opts">
<label class="opt"><input type="checkbox" name="scope" value="fin"><span data-i="scope_fin">Finance</span></label>
<label class="opt"><input type="checkbox" name="scope" value="sal"><span data-i="scope_sal">Sales</span></label>
<label class="opt"><input type="checkbox" name="scope" value="sc"><span data-i="scope_sc">Supply Chain</span></label>
<label class="opt"><input type="checkbox" name="scope" value="mfg"><span data-i="scope_mfg">Manufacturing</span></label>
<label class="opt"><input type="checkbox" name="scope" value="pro"><span data-i="scope_pro">Procurement</span></label></div></fieldset>
<fieldset><legend data-i="phase">Project phase</legend><div class="opts">
<label class="opt"><input type="radio" name="phase" value="str"><span data-i="phase_str">Strategy &amp; Business Case</span></label>
<label class="opt"><input type="radio" name="phase" value="rfp"><span data-i="phase_rfp">Vendor Selection &amp; RFP</span></label>
<label class="opt"><input type="radio" name="phase" value="imp"><span data-i="phase_imp">Implementation</span></label>
<label class="opt"><input type="radio" name="phase" value="tra"><span data-i="phase_tra">Active Transformation</span></label></div></fieldset>
<fieldset><legend data-i="priority">Core priority</legend><div class="opts">
<label class="opt"><input type="radio" name="prio" value="cost"><span data-i="prio_cost">Cost Optimization</span></label>
<label class="opt"><input type="radio" name="prio" value="speed"><span data-i="prio_speed">Speed to Market (Timeline)</span></label>
<label class="opt"><input type="radio" name="prio" value="std"><span data-i="prio_std">Standardisation (Fit-to-Standard)</span></label>
<label class="opt"><input type="radio" name="prio" value="ai"><span data-i="prio_ai">Innovation &amp; AI</span></label></div></fieldset>
<button class="btn" type="submit" id="go" disabled data-i="generate">Generate my checklist</button>
</form>
<div id="out" hidden></div>
<p class="fine noprint"><a class="back" href="/" data-i="back">Back to the site</a></p>
</main>

mpagnies transfrontalière.",

ective scoring.":"Prévoyez deux semaines pour les présentations et imposez un ordre du jour commun pour permettre une notation objective.","SoW parallel negotiation":"Négociation parallèle de la déclaration des travaux","Start contract and SoW markups with the top two vendors simultaneously to keep commercial leverage before final selection.":"Négociez en parallèle le contrat et la déclaration des travaux avec les deux finalistes afin de préserver votre levier commercial.","Final award & contract execution":"Attribution finale et signature du contrat","Issue the award notice, execute the Master Services Agreement (MSA) and trigger the project kick-off.":"Notifiez l’attribution, signez le contrat-cadre de services (MSA) et lancez le projet."

"Global Template, Geographic Presence & Localization":"Globales Template, Länderabdeckung und Lokalisierung","Establish a global core policy":"Richtlinie für den globalen Kern festlegen","Decide upfront how much local variation is permitted versus strict adherence to a single global standard.":"Entscheiden Sie früh, welche lokalen Abweichungen zulässig sind und wie konsequent ein globaler Standard gilt.","Map statutory requirements":"Gesetzliche Anforderungen erfassen","List mandatory localizations (e.g., invoicing formats such as SAF-T, country-specific payroll, electronic tax filing).":"Listen Sie erforderliche Lokalisierungen auf, etwa SAF-T-Rechnungsformate, landesspezifische Entgeltabrechnung oder elektronische Steuererklärungen.","Language and currency matrix":"Sprachen- und Währungsmatrix","Define required system UI languages, document print outputs and multi-currency reporting frameworks.":"Legen Sie die erforderlichen Oberflächensprachen, Dokumentausgaben und Regeln für die Mehrwährungsberichterstattung fest.",

"Vendor Demonstrations & Oral Presentations":"Anbieterdemos und Präsentationen","Script your demo scenarios":"Demonstrationsszenarien vorbereiten","Do not let vendors show canned presentations. Provide 3 to 5 real-world business scenarios. Ideas for your scope: ":"Vermeiden Sie Standardpräsentationen. Geben Sie drei bis fünf reale Geschäftsszenarien vor. Beispiele für Ihren Umfang: ","Score the team, not just the salesperson":"Das Team statt nur den Vertrieb bewerten","Require the proposed Project Manager and Lead Solution Architects to present, not just the sales team.":"Lassen Sie den vorgeschlagenen Projektleiter und die leitenden Lösungsarchitekten präsentieren, nicht nur das Vertriebsteam.","Set strict timeboxes":"Feste Zeitfenster vorgeben","Allocate dedicated, equal blocks for system presentation, architecture review and Q&A.":"Planen Sie gleiche Zeitfenster für Systemdemo, Architekturprüfung und Fragen ein.",
"AI Capabilities & Future Extensibility":"KI-Funktionen und künftige Erweiterbarkeit","Enforce clean core principles":"Clean-Core-Prinzipien durchsetzen","Require the vendor to prove how customizations will be handled (e.g., with SAP Build / Business Technology Platform) without touching the core code.":"Lassen Sie sich zeigen, wie Erweiterungen etwa mit SAP Build oder der Business Technology Platform ohne Änderungen am Kern umgesetzt werden.","Request specific AI use cases":"Konkrete KI-Anwendungsfälle anfordern","Ask how the vendor uses SAP Joule or embedded AI features to optimize your scope. Examples to probe: ":"Fragen Sie, wie der Anbieter SAP Joule oder integrierte KI für Ihren Umfang nutzt. Zu prüfende Beispiele: ","Assess innovation roadmaps":"Innovationsfahrpläne bewerten","Ensure the proposed solution accounts for the SAP upgrade cycles (twice-yearly or annual, depending on edition).":"Prüfen Sie, ob die Lösung die SAP-Upgrade-Zyklen berücksichtigt, die je nach Edition halbjährlich oder jährlich stattfinden.","AI-driven lifecycle delivery":"KI über den gesamten Projektlebenszyklus nutzen","Require the vendor to detail how generative AI and automation agents are embedded across the project lifecycle (automated discovery, functional specs, configuration, code refactoring, data cleansing, testing, training creation) to reduce delivery cost while maximizing quality.":"Lassen Sie erläutern, wie generative KI und Automatisierungsagenten den gesamten Projektlebenszyklus unterstützen: Analyse, Fachkonzepte, Konfiguration, Refactoring, Datenbereinigung, Tests und Schulungsunterlagen, um Kosten zu senken und Qualität zu sichern.",
"RFP Procurement Timeline & Milestones":"Beschaffungszeitplan und RFP-Meilensteine","RFP release & intention to bid":"RFP-Veröffentlichung und Teilnahmebestätigung","Issue the RFP package to qualified vendors and set a 48-hour deadline for their formal “Intention to Bid” or NDA.":"Senden Sie qualifizierten Anbietern die RFP-Unterlagen und setzen Sie eine Frist von 48 Stunden für Teilnahmebestätigung oder NDA.","Vendor questions deadline & caps":"Frist und Höchstzahl der Anbieterfragen","Set a strict deadline for questions and cap them at 30 per vendor to prevent “RFP spamming” and force high-quality inquiries.":"Setzen Sie eine feste Frist und begrenzen Sie Fragen auf 30 je Anbieter, um übermäßige und wenig hilfreiche Rückfragen zu vermeiden.","Q&A resolution strategy":"Vorgehen für Fragen und Antworten","Specify whether answers go out as one combined, anonymized document to all vendors, or through isolated 1-on-1 calls for highly proprietary architectures.":"Legen Sie fest, ob Antworten gesammelt und anonymisiert an alle Anbieter gehen oder bei vertraulichen Architekturen in Einzelgesprächen erfolgen.","RFP submission deadline & hard cut-off":"Abgabefrist und verbindlicher Annahmeschluss","Set a definitive closing date and time (e.g., 6:00 PM CET) and state that late submissions via the procurement portal are locked out automatically.":"Legen Sie Datum und Uhrzeit der Abgabe verbindlich fest und weisen Sie darauf hin, dass das Beschaffungsportal verspätete Angebote automatisch sperrt.","Down-selection & preselection notice":"Auswahlrunde und Mitteilung der Vorauswahl","Allocate a structured window to score proposals and notify the top 2 to 3 vendors.":"Planen Sie ausreichend Zeit für die Bewertung ein und benachrichtigen Sie die zwei bis drei ausgewählten Anbieter.","Oral presentations and guided demos":"Präsentationen und geführte Demos","Schedule a 2-week window for orals and enforce a standardized agenda across all vendors for objective scoring.":"Planen Sie zwei Wochen für Präsentationen ein und verwenden Sie bei allen Anbietern dieselbe Agenda für eine objektive Bewertung.","SoW parallel negotiation":"Parallele Verhandlung der Leistungsbeschreibung","Start contract and SoW markups with the top two vendors simultaneously to keep commercial leverage before final selection.":"Verhandeln Sie Vertrag und Leistungsbeschreibung parallel mit den beiden Finalisten, um Ihre Verhandlungsposition zu sichern.","Final award & contract execution":"Endgültige Vergabe und Vertragsabschluss","Issue the award notice, execute the Master Services Agreement (MSA) and trigger the project kick-off.":"Erteilen Sie den Zuschlag, unterzeichnen Sie den Master Services Agreement (MSA) und starten Sie das Projekt."

   ["Vendor questions deadline & caps","Set a strict deadline for questions and cap them at 30 per vendor to prevent “RFP spamming” and force high-quality inquiries."],
   ["Q&A resolution strategy","Specify whether answers go out as one combined, anonymized document to all vendors, or through isolated 1-on-1 calls for highly proprietary architectures."],
   ["RFP submission deadline & hard cut-off","Set a definitive closing date and time (e.g., 6:00 PM CET) and state that late submissions via the procurement portal are locked out automatically."],
   ["Down-selection & preselection notice","Allocate a structured window to score proposals and notify the top 2 to 3 vendors."],
   ["Oral presentations and guided demos","Schedule a 2-week window for orals and enforce a standardized agenda across all vendors for objective scoring."],
   ["SoW parallel negotiation","Start contract and SoW markups with the top two vendors simultaneously to keep commercial leverage before final selection."],
   ["Final award & contract execution","Issue the award notice, execute the Master Services Agreement (MSA) and trigger the project kick-off."]]}
  ];
  return content.map(section=>({...section,t:localize(section.t),i:section.i.map(item=>item&&[localize(item[0]),localize(item[1])])}));
}

const form=document.getElementById("params"),go=document.getElementById("go"),out=document.getElementById("out");
const val=n=>{const e=form.querySelector('input[name="'+n+'"]:checked');return e?e.value:null};
const scopes=()=>[...form.querySelectorAll('input[name="scope"]:checked')].map(e=>e.value);
function ready(){go.disabled=!(val("type")&&val("phase")&&val("prio")&&scopes().length)}
form.addEventListener("change",ready);
out.addEventListener("change",()=>progress());

function progress(){
  const all=out.querySelectorAll(".items input"),n=[...all].filter(i=>i.checked).length;
  const p=document.getElementById("pg");if(p)p.textContent=n+" / "+all.length+" "+T.ui.items;
}
form.addEventListener("submit",e=>{
  e.preventDefault();ready();if(go.disabled)return;
  const S={type:val("type"),phase:val("phase"),prio:val("prio"),scope:scopes()};
  const focus=new Set([...PF[S.phase],...RF[S.prio]]);
  const secs=sections(S);
  let h=`<h2>${T.ui.step2}</h2><ul class="chips"><li>${TY[S.type]}</li>`+S.scope.map(k=>`<li>${SC[k]}</li>`).join("")+`<li>${PH[S.phase]}</li><li>${PR[S.prio]}</li></ul>`+
    `<p class="note">${PBAN[S.phase]}</p><p class="note">${RBAN[S.prio]}</p>`+
    `<p class="prog" id="pg"></p><p class="noprint"><button type="button" class="btn" id="print">${T.ui.print}</button><button type="button" class="btn alt" id="edit">${T.ui.edit}</button></p>`;
  secs.forEach(s=>{
    const items=s.i.filter(Boolean);
    h+=`<section class="sec${focus.has(s.id)?" focus":""}"><h3>${s.id}. ${s.t}${focus.has(s.id)?'<span class="badge">'+T.ui.focus+'</span>':""}</h3><ul class="items">`+
      items.map(x=>`<li><label><input type="checkbox"><span><b>${x[0]}.</b><small>${x[1]}</small></span></label></li>`).join("")+`</ul>`;
    if(s.id==="8"){
      h+=`<p class="fine">${T.ui.dates}</p><div class="tw"><table><thead><tr><th>${T.ui.milestone}</th><th>${T.ui.target_date}</th><th>${T.ui.local_time}</th><th>${T.ui.notes}</th></tr></thead><tbody>`+
        MILES.map((m,k)=>`<tr><td><b>${m[0]}</b></td><td><input type="date" aria-label="${T.ui.target_date}: ${m[0]}"></td><td>${m[1]}</td><td>${m[2]}</td></tr>`).join("")+`</tbody></table></div>`;
    }
    h+=`</section>`;
  });
  out.innerHTML=h;out.hidden=false;progress();
  document.getElementById("print").onclick=()=>window.print();
  document.getElementById("edit").onclick=()=>{form.scrollIntoView({behavior:"smooth"})};
  out.scrollIntoView({behavior:"smooth",block:"start"});
});
</script>
